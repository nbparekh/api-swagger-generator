[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swagger-gen"
version = "1.0.0"
description = "Decentralized on-the-fly Swagger generator for AWS Lambda"
dependencies = [
    "apispec>=6.4.0",
    "marshmallow>=3.20.0",
    "pyyaml>=6.0"
]

[project.scripts]
swagger-gen = "swagger_gen.generator:main"